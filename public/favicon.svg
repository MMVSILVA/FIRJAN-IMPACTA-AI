<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="32" fill="#090915" />
  <!-- Border gradient -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#primary-grad)" stroke-width="4.5" opacity="0.85" />
  
  <!-- Stylized modern F with integrated digital nodes and a bright star -->
  <!-- Left thick vertical line for F -->
  <rect x="36" y="32" width="14" height="64" rx="7" fill="url(#primary-grad)" />
  <!-- Upper horizontal arm -->
  <rect x="36" y="32" width="48" height="14" rx="7" fill="url(#primary-grad)" />
  <!-- Middle horizontal arm -->
  <rect x="36" y="58" width="34" height="12" rx="6" fill="url(#primary-grad)" />
  
  <!-- 4-point Sparkle (AI/Innovation indicator) with drop-shadow glow -->
  <path d="M84 72 C84 72 90 82 98 84 C90 86 84 96 84 96 C84 96 78 86 70 84 C78 82 84 72 84 72 Z" fill="#34D399" filter="url(#glow)" />
  <circle cx="84" cy="84" r="3" fill="#FFFFFF" />
</svg>
